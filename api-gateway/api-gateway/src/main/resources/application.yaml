server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: products-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/products/**

            - id: categories-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/categories/**

            - id: cart-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/cart/**

            - id: order-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/orders/**

            - id: address-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/addresses/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: OpenCommerceSecretKeyOpenCommerceSecretKeyOpenCommerceSecretKey123

management:
  endpoints:
    web:
      exposure:
        include: "*"