spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

management.endpoints.web.exposure.include=health,info

spring.cloud.gateway.mvc.routes[0].id=google
spring.cloud.gateway.mvc.routes[0].uri=https://www.google.com
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/google/**